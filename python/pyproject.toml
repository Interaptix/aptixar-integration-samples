[project]
name = "aptixar-uploader"
version = "0.2.0"
description = "Reference Python client for the Aptixar Integration API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
]

[project.scripts]
aptixar-upload = "aptixar_uploader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aptixar_uploader*"]
