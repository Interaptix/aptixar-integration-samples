name: integration-status

on:
  schedule:
    - cron: '23 14 * * 1'   # Mondays 14:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-status
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: requestUpload smoke against api.aptixar.com
        env:
          APTIXAR_TOKEN: ${{ secrets.APTIXAR_TOKEN }}
          CI_ASSET_ID: ${{ vars.CI_ASSET_ID }}
        run: bash .github/scripts/integration_smoke.sh

      - name: Notify webhook on failure
        if: failure()
        env:
          FAILURE_WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
        run: |
          [ -z "$FAILURE_WEBHOOK_URL" ] && { echo "no webhook set; skipping"; exit 0; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 30 --connect-timeout 10 -X POST "$FAILURE_WEBHOOK_URL" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "Aptixar integration smoke FAILED — $run_url" \
                        --arg repo "$GITHUB_REPOSITORY" --arg url "$run_url" \
                        '{text:$t, repo:$repo, run_url:$url, status:"failure"}')" || true
